name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Poetry needs Python >= 3.10, so install it with pipx (runner's system
      # Python) rather than into the Python under test.
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install --no-interaction
      - name: Check formatting
        run: make format-check
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install --no-interaction
      - name: Run tests
        run: make test
